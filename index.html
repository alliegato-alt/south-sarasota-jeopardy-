<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>South Sarasota Goal Challenge</title>
<style>
:root{--n:#0a2d4e;--b:#087fc1;--t:#00a2b2;--g:#f4b537;--w:#fff;--m:#40546a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--n);color:white}button{font-family:inherit;touch-action:manipulation}
.screen{display:none;min-height:100vh;padding:12px}.screen.active{display:flex;flex-direction:column}
h1{text-align:center;color:var(--g);margin:0;font-size:clamp(26px,4vw,44px)}.sub{text-align:center;color:var(--t);font-weight:800;margin:5px}
.scorebar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.scorebox{background:white;color:var(--n);padding:7px 10px;border-radius:9px;font-weight:800;display:flex;align-items:center;gap:6px}.scorebox span{font-size:24px;min-width:35px;text-align:center}
.small{border:0;border-radius:7px;padding:7px 10px;background:var(--t);color:white;font-weight:800;font-size:17px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1;max-width:1200px;width:100%;margin:auto}.col{display:grid;grid-template-rows:64px repeat(5,minmax(72px,1fr));gap:8px;min-width:0}
.cat{background:var(--t);border-radius:9px;padding:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(11px,1.4vw,17px)}.value{background:var(--b);border:2px solid #bfefff;border-radius:9px;color:white;font-size:clamp(25px,4vw,40px);font-weight:900}.value.used{background:var(--m);color:#8495a7;border-color:#60758b;text-decoration:line-through;pointer-events:none}
.footer{text-align:center;font-weight:800;padding-top:8px}.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:1100px;width:100%;margin:auto}.label{color:var(--t);font-size:26px;font-weight:900;margin-bottom:22px}.question{font-size:clamp(30px,5vw,54px);font-weight:900}.answer{background:white;color:var(--b);padding:32px;border-radius:18px;width:100%;font-size:clamp(34px,5vw,58px);font-weight:900}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}.action{border:0;border-radius:9px;padding:14px 20px;background:var(--b);color:white;font-size:18px;font-weight:900}.alt{background:var(--t)}.gold{background:var(--g);color:var(--n)}
@media(max-width:760px){.screen{padding:7px}.board,.col{gap:5px}.col{grid-template-rows:56px repeat(5,minmax(62px,1fr))}.cat{font-size:10px}.value{font-size:28px}}
</style></head><body>
<section id="board" class="screen active"><h1>SOUTH SARASOTA • ROAD TO 55 & 30</h1><div class="sub">GOAL CHALLENGE • 100–500</div><div class="scorebar">
<div class="scorebox">TEAM 1 <button class="small" onclick="manualScore(1,-100)">−</button><span id="s1">0</span><button class="small" onclick="manualScore(1,100)">+</button></div>
<div class="scorebox">TEAM 2 <button class="small" onclick="manualScore(2,-100)">−</button><span id="s2">0</span><button class="small" onclick="manualScore(2,100)">+</button></div>
<button class="small" onclick="resetGame()">RESET GAME</button></div><div class="board"><div class="col"><div class="cat">YES TODAY</div><button class="value" id="b-c0r0" onclick="openClue('c0r0')">100</button><button class="value" id="b-c0r1" onclick="openClue('c0r1')">200</button><button class="value" id="b-c0r2" onclick="openClue('c0r2')">300</button><button class="value" id="b-c0r3" onclick="openClue('c0r3')">400</button><button class="value" id="b-c0r4" onclick="openClue('c0r4')">500</button></div><div class="col"><div class="cat">SAME DAY</div><button class="value" id="b-c1r0" onclick="openClue('c1r0')">100</button><button class="value" id="b-c1r1" onclick="openClue('c1r1')">200</button><button class="value" id="b-c1r2" onclick="openClue('c1r2')">300</button><button class="value" id="b-c1r3" onclick="openClue('c1r3')">400</button><button class="value" id="b-c1r4" onclick="openClue('c1r4')">500</button></div><div class="col"><div class="cat">PATIENT EXPERIENCE</div><button class="value" id="b-c2r0" onclick="openClue('c2r0')">100</button><button class="value" id="b-c2r1" onclick="openClue('c2r1')">200</button><button class="value" id="b-c2r2" onclick="openClue('c2r2')">300</button><button class="value" id="b-c2r3" onclick="openClue('c2r3')">400</button><button class="value" id="b-c2r4" onclick="openClue('c2r4')">500</button></div><div class="col"><div class="cat">CONFIDENT CONVERSATIONS</div><button class="value" id="b-c3r0" onclick="openClue('c3r0')">100</button><button class="value" id="b-c3r1" onclick="openClue('c3r1')">200</button><button class="value" id="b-c3r2" onclick="openClue('c3r2')">300</button><button class="value" id="b-c3r3" onclick="openClue('c3r3')">400</button><button class="value" id="b-c3r4" onclick="openClue('c3r4')">500</button></div><div class="col"><div class="cat">ONE TEAM</div><button class="value" id="b-c4r0" onclick="openClue('c4r0')">100</button><button class="value" id="b-c4r1" onclick="openClue('c4r1')">200</button><button class="value" id="b-c4r2" onclick="openClue('c4r2')">300</button><button class="value" id="b-c4r3" onclick="openClue('c4r3')">400</button><button class="value" id="b-c4r4" onclick="openClue('c4r4')">500</button></div></div><div class="footer">55% YES TODAY • 30% SAME DAY</div></section>
<section id="clue" class="screen"><div class="center"><div id="ql" class="label"></div><div id="q" class="question"></div><div class="actions"><button class="action" onclick="reveal()">REVEAL ANSWER</button><button class="action alt" onclick="backBoard()">BACK TO BOARD</button></div></div></section>
<section id="answer" class="screen"><div class="center"><div id="al" class="label"></div><div id="a" class="answer"></div><div class="actions"><button class="action gold" onclick="award(1)">TEAM 1 + POINTS</button><button class="action gold" onclick="award(2)">TEAM 2 + POINTS</button><button class="action alt" onclick="backBoard()">NO POINTS / BOARD</button></div></div></section>
<script>
const D=[{"id": "c0r0", "cat": "YES TODAY", "val": 100, "q": "What is South Sarasota\u2019s August Yes Today goal?", "a": "55%"}, {"id": "c0r1", "cat": "YES TODAY", "val": 200, "q": "Where did South Sarasota finish July for Yes Today?", "a": "35.8%"}, {"id": "c0r2", "cat": "YES TODAY", "val": 300, "q": "How many percentage points must Yes Today improve to reach the August goal?", "a": "19.2 percentage points"}, {"id": "c0r3", "cat": "YES TODAY", "val": 400, "q": "True or False: A clear financial conversation can reduce confusion around a treatment decision.", "a": "True"}, {"id": "c0r4", "cat": "YES TODAY", "val": 500, "q": "Before a patient leaves without scheduling treatment, what should the team clearly confirm?", "a": "The patient\u2019s next step / follow-up plan"}, {"id": "c1r0", "cat": "SAME DAY", "val": 100, "q": "What is South Sarasota\u2019s August Same Day goal?", "a": "30%"}, {"id": "c1r1", "cat": "SAME DAY", "val": 200, "q": "Where did South Sarasota finish July for Same Day?", "a": "22.6%"}, {"id": "c1r2", "cat": "SAME DAY", "val": 300, "q": "How many percentage points must Same Day improve to reach the August goal?", "a": "7.4 percentage points"}, {"id": "c1r3", "cat": "SAME DAY", "val": 400, "q": "True or False: Same Day means starting appropriate accepted treatment during the visit when clinically and operationally possible.", "a": "True"}, {"id": "c1r4", "cat": "SAME DAY", "val": 500, "q": "What number should the team immediately know when discussing the August Same Day target?", "a": "30%"}, {"id": "c2r0", "cat": "PATIENT EXPERIENCE", "val": 100, "q": "Who owns the patient experience?", "a": "Everyone on the team"}, {"id": "c2r1", "cat": "PATIENT EXPERIENCE", "val": 200, "q": "True or False: Long unexplained waits can hurt patient experience.", "a": "True"}, {"id": "c2r2", "cat": "PATIENT EXPERIENCE", "val": 300, "q": "What should a patient receive when timing changes during the visit?", "a": "A clear update and expectation"}, {"id": "c2r3", "cat": "PATIENT EXPERIENCE", "val": 400, "q": "Which is stronger service recovery: ignoring a concern or acknowledging it and helping solve it?", "a": "Acknowledging it and helping solve it"}, {"id": "c2r4", "cat": "PATIENT EXPERIENCE", "val": 500, "q": "What should every patient understand before leaving the office?", "a": "What happens next"}, {"id": "c3r0", "cat": "CONFIDENT CONVERSATIONS", "val": 100, "q": "Which comes first when uncovering a patient concern: listening or persuading?", "a": "Listening"}, {"id": "c3r1", "cat": "CONFIDENT CONVERSATIONS", "val": 200, "q": "True or False: Consistent messages across the team help build patient confidence.", "a": "True"}, {"id": "c3r2", "cat": "CONFIDENT CONVERSATIONS", "val": 300, "q": "When a patient says \u201cI need to think about it,\u201d what should the team identify before ending the conversation?", "a": "The patient\u2019s specific concern or barrier"}, {"id": "c3r3", "cat": "CONFIDENT CONVERSATIONS", "val": 400, "q": "What should the team avoid: conflicting messages or consistent messages?", "a": "Conflicting messages"}, {"id": "c3r4", "cat": "CONFIDENT CONVERSATIONS", "val": 500, "q": "What communication habit helps prevent surprises during a patient visit?", "a": "Setting and updating expectations"}, {"id": "c4r0", "cat": "ONE TEAM", "val": 100, "q": "How many teams are competing in today\u2019s Goal Challenge?", "a": "2"}, {"id": "c4r1", "cat": "ONE TEAM", "val": 200, "q": "True or False: Front office and clinical teams both influence Yes Today and Same Day results.", "a": "True"}, {"id": "c4r2", "cat": "ONE TEAM", "val": 300, "q": "During a patient handoff, what should transfer with the patient?", "a": "Clear information / the plan"}, {"id": "c4r3", "cat": "ONE TEAM", "val": 400, "q": "What should the team celebrate during August: only the final result or progress toward the goal?", "a": "Progress toward the goal"}, {"id": "c4r4", "cat": "ONE TEAM", "val": 500, "q": "What are South Sarasota\u2019s two August targets?", "a": "55% Yes Today and 30% Same Day"}]; let current=null; let state=JSON.parse(localStorage.getItem('ssj-state')||'{"s1":0,"s2":0,"used":[]}');
function save(){localStorage.setItem('ssj-state',JSON.stringify(state))}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function paint(){document.getElementById('s1').textContent=state.s1;document.getElementById('s2').textContent=state.s2;D.forEach(x=>{const b=document.getElementById('b-'+x.id);if(b)b.classList.toggle('used',state.used.includes(x.id))})}
function openClue(id){current=D.find(x=>x.id===id);document.getElementById('ql').textContent=current.cat+' • '+current.val;document.getElementById('q').textContent=current.q;show('clue')}
function reveal(){if(!state.used.includes(current.id))state.used.push(current.id);save();paint();document.getElementById('al').textContent=current.cat+' • '+current.val+' • ANSWER';document.getElementById('a').textContent=current.a;show('answer')}
function award(team){state['s'+team]+=current.val;save();paint();backBoard()}
function manualScore(team,d){state['s'+team]+=d;save();paint()}
function backBoard(){show('board')}
function resetGame(){if(confirm('Reset scores and restore all clues?')){state={s1:0,s2:0,used:[]};save();paint();show('board')}}
paint();
</script></body></html>
